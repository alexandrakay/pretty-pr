name: 'PRetty'
description: 'Auto-generate PR descriptions from commits and post as a comment.'

branding:
  icon: 'git-pull-request'
  color: 'purple'

inputs:
  anthropic-api-key:
    description: 'Anthropic API key'
    required: true
  post-if-empty:
    description: 'Only post if the PR description is empty (true/false)'
    required: false
    default: 'true'
  mode:
    description: 'Generation mode: commits, diff, or full'
    required: false
    default: 'diff'
  slack-webhook-url:
    description: 'Slack incoming webhook URL — posts a one-line PR summary when a PR is opened (optional)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install action dependencies
      shell: bash
      run: npm install --prefix ${{ github.action_path }}/action @anthropic-ai/sdk

    - name: Generate and post PR description
      shell: bash
      run: node ${{ github.action_path }}/action/index.js
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        POST_IF_EMPTY: ${{ inputs.post-if-empty }}
        MODE: ${{ inputs.mode }}
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        REPO: ${{ github.repository }}
        SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook-url }}
